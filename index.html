<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;background:#080b10;color:#fff}
.page{
height:100vh;height:100dvh;width:100%;
min-height:400px;overflow:hidden;
display:flex;align-items:center;justify-content:center;
padding:16px;position:relative;isolation:isolate;
background:radial-gradient(ellipse at 50% 38%,#15392d,#0d201b 30%,transparent 70%),
linear-gradient(145deg,#10151d,#06080c 75%);
}
.page:before{
content:"";position:absolute;inset:0;z-index:-1;opacity:.13;
background-image:linear-gradient(#ffffff12 1px,transparent 1px),
linear-gradient(90deg,#ffffff12 1px,transparent 1px);
background-size:32px 32px;
}
.glow{
position:absolute;width:240px;height:240px;border-radius:50%;
background:#20d58b;filter:blur(110px);opacity:.14;
top:15%;left:50%;transform:translateX(-50%);z-index:-1;
}
.card{
width:min(100%,390px);text-align:center;padding:25px 21px;
border:1px solid #ffffff20;border-radius:25px;
background:linear-gradient(155deg,#ffffff12,#ffffff05 55%,#0c221940);
box-shadow:0 25px 80px #0006;backdrop-filter:blur(15px);
}
.top-label{
display:inline-flex;align-items:center;gap:7px;padding:7px 12px;
border:1px solid #f7c75b55;border-radius:50px;color:#f7c75b;
font-size:10px;font-weight:800;letter-spacing:2px;
}
.dot{width:7px;height:7px;border-radius:50%;background:#36e69b;box-shadow:0 0 9px #36e69b}
.emblem{
width:108px;height:108px;margin:20px auto 17px;
display:grid;place-items:center;border-radius:50%;
border:1px solid #f7c75b99;
background:radial-gradient(circle,#f7c75b25,#101c17 70%);
box-shadow:0 0 32px #f7c75b14;
}
.emblem svg{width:76px;height:76px}
h1{font-size:clamp(29px,8vw,38px);line-height:1.05;font-weight:900;letter-spacing:1px}
h1 span{display:block;margin-top:5px;color:#f7c75b}
.subtitle{
margin:12px auto 20px;max-width:280px;color:#b5c1bd;
font-size:13px;line-height:1.6;
}
.features{display:flex;justify-content:center;gap:7px;margin-bottom:22px}
.feature{
flex:1;padding:10px 3px;border-radius:10px;
border:1px solid #ffffff12;background:#ffffff08;
font-size:10px;color:#e4e9e6;
}
.feature b{display:block;margin-bottom:5px;color:#f7c75b;font-size:17px}
.join-btn{
display:flex;align-items:center;justify-content:center;gap:10px;
width:100%;min-height:53px;padding:14px;border-radius:12px;
text-decoration:none;color:#06120d;
background:linear-gradient(100deg,#ffe39a,#f7c75b 52%,#eeb340);
box-shadow:0 7px 24px #f7c75b2b;
font-size:14px;font-weight:900;letter-spacing:.4px;
}
.join-btn svg{width:21px;height:21px}
.note{margin-top:13px;color:#82908a;font-size:10px;letter-spacing:.3px}
.contact{
position:fixed;z-index:10;right:12px;bottom:12px;
display:flex;align-items:center;gap:7px;padding:10px 12px;
border-radius:12px;border:1px solid #ffffff25;
background:#10181ef2;box-shadow:0 5px 25px #0006;
color:#fff;text-decoration:none;font-size:10px;font-weight:700;
backdrop-filter:blur(10px);
}
.contact svg{width:18px;height:18px;flex-shrink:0}
@media(max-height:620px){
.card{padding:12px 18px}
.emblem{width:65px;height:65px;margin:8px auto}
.emblem svg{width:45px;height:45px}
.subtitle{margin:7px auto 10px}
.features{margin-bottom:10px}
.note{margin-top:7px}
}
@media(max-width:350px){
.card{padding:17px 13px}
.feature{font-size:9px}
.contact{right:8px;bottom:8px;padding:8px 10px}
}
</style>
